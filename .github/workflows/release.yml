name: Release

# Tag a commit `vX.Y.Z` (the version in pyproject.toml) to test it, build the wheel and the sdist, and publish a GitHub
# Release whose notes are the CHANGELOG section of that version. Nothing is published to PyPI.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Release notes (the tag must name the version)
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - run: git config --global init.defaultBranch main

      - name: Tests
        run: python -m unittest discover -s tests -t tests

      - name: Build the wheel and the sdist
        run: |
          python -m pip install build
          python -m build

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
