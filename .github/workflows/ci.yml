name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # ruff is CI tooling, not a dependency; its rules are in pyproject.toml.
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The tests make throwaway git repos; their first branch is main whatever the runner's git defaults to.
      - run: git config --global init.defaultBranch main

      # Standard library only: the package has no dependency to install. coverage.py is CI tooling, not a dependency.
      - name: Install the package and coverage.py
        run: python -m pip install . coverage

      - name: The installed command runs
        run: signalbox --version

      # The race tests (tests/test_races.py) start processes that meet at a barrier and claim one file together:
      # exactly one must win, on Windows too.
      - name: Tests with coverage
        run: python -m coverage run --source=src/ai_signalbox -m unittest discover -s tests -t tests

      - name: Coverage summary (fails under 80%)
        run: python -m coverage report --skip-empty --sort=cover --fail-under=80
