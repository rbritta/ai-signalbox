name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The tests make throwaway git repos; their first branch is main whatever the runner's git defaults to.
      - run: git config --global init.defaultBranch main

      # Standard library only: the package has no dependency to install. coverage.py is CI tooling, not a dependency.
      - name: Install the package and coverage.py
        run: python -m pip install . coverage

      - name: The installed command runs
        run: signalbox --version

      - name: Tests with coverage
        run: python -m coverage run --source=src/ai_signalbox -m unittest discover -s tests -t tests

      - name: Coverage summary
        run: python -m coverage report --skip-empty --sort=cover
