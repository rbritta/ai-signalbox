[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-signalbox"
version = "0.2.1"
description = "A signal box for many AI coding sessions working side by side: who is who, what each is doing, shared resources, the workflow, and routing a message to the right session."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rbritta" }]
requires-python = ">=3.12.7,!=3.13.0"
dependencies = []
keywords = ["ai", "agents", "claude-code", "coordination", "multi-session", "hooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]

[project.optional-dependencies]
proc = ["psutil>=5.9"]

[project.scripts]
signalbox = "ai_signalbox.cli:main"

[project.urls]
Homepage = "https://github.com/rbritta/ai-signalbox"
Demo = "https://rbritta.github.io/ai-signalbox/demo/"
Changelog = "https://github.com/rbritta/ai-signalbox/blob/main/CHANGELOG.md"
Issues = "https://github.com/rbritta/ai-signalbox/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6", "B006", "B008", "B904"]
ignore = ["E741"]                       # `l` for a line is this code base's habit
